[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["PJ568 <pj568@pj568.eu.org>"]
repository = "https://github.com/Byte-tea/yaa"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4", features = ["derive"] }
ulid = "1"
sha2 = "0.10"
libc = "0.2"
tempfile = "3"

# 在调试模式下只启用少量的优化措施
[profile.dev]
opt-level = 1

# 对依赖的库启用更高级别的优化
[profile.dev.package."*"]
opt-level = 3

# 链接时间优化：以极慢的编译时间为代价，挤出更多的性能
[profile.release]
strip = true      # 自动从二进制文件去除符号信息
opt-level = "z"   # 二进制文件大小优化
lto = "thin"
codegen-units = 1
