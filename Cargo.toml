[package]
name = "xidong"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["PJ568 <[EMAIL]>"]
description = "西东智能体：以 Shell 为唯一工具的轻量命令行智能体"
repository = "https://github.com/Xidong-AI/xidong"
readme = "README.md"
keywords = ["agent", "cli", "llm"]
categories = ["command-line-utilities"]

[lib]
name = "xidong"
path = "src/lib.rs"

[[bin]]
name = "xidong"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
ulid = "1"

[dev-dependencies]
axum = "0.8"

# 在调试模式下只启用少量的优化措施
[profile.dev]
opt-level = 1

# 对依赖的库启用更高级别的优化
[profile.dev.package."*"]
opt-level = 3

# 链接时间优化：以极慢的编译时间为代价，挤出更多的性能
[profile.release]
strip = true      # 自动从二进制文件去除符号信息
opt-level = "z"   # 二进制文件大小优化
lto = "thin"
codegen-units = 1
