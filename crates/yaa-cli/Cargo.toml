[package]
name = "yaa-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "yaa"
path = "src/main.rs"

[dependencies]
yaa-core = { path = "../yaa-core" }
yaa-store = { path = "../yaa-store" }
yaa-msg = { path = "../yaa-msg" }
yaa-exec = { path = "../yaa-exec" }
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
# `--json` 的 JsonSink 在运行期序列化展示条目。
serde_json.workspace = true
# `--no-store` 运行期创建临时会话目录。
tempfile.workspace = true

[dev-dependencies]
# 仅测试用：假的 OpenAI 兼容服务端。
axum = "0.8"
sha2.workspace = true
