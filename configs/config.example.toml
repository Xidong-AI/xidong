# yaa 配置示例。
#
# 复制到 $YAA_CONFIG_HOME/config.toml（默认 ~/.config/yaa/config.toml）。
# 钩子是一段 shell 命令，以 `sh -c` 执行：
#   - init：空会话初始化，仅执行一次；stdout 不进入上下文，内容由命令内的
#     `yaa --notify` 写入；
#   - llm：每次运行执行一次，输出模型供应配置的 TOML（格式见 llm.example.toml）；
#   - estimate（可选）：压缩判定的 token 估算，stdin 收 JSON 字符串数组、stdout 回等长
#     JSON 整数数组；未配置或失败时回退内置二分类启发式。

[hooks]
# `$YAA_BIN` 是当前 yaa 可执行文件的绝对路径，避免 PATH 中没有 yaa 时钩子失败。
# 内置系统提示词由 `"$YAA_BIN" --get-prompt system` 提供。
# 没有 AGENTS.md 时不 notify，避免注入空信封。
# 首行 `set -e` 保证任一条 notify 失败即整体失败，避免假成功。
init = '''
set -e
"$YAA_BIN" --notify="系统提示词" -- "$YAA_BIN" --get-prompt system
if [ -f "$GLB_CFG/AGENTS.md" ]; then "$YAA_BIN" --notify="用户总提示词" -- cat "$GLB_CFG/AGENTS.md"; fi
"$YAA_BIN" --notify="当前环境" -- echo "工作目录：$(pwd)"
'''
llm = "cat $YAA_CONFIG_HOME/llm.toml"
# 可选：外部 token 估算钩子（默认不启用）。压缩判定前，把本次投影的全部文本字段
# 去重后以 JSON 字符串数组写入 stdin；钩子须在 stdout 返回等长的 JSON 整数数组
# （每个字段的 token 数）。超时、非零退出或输出不合法时回退内置启发式，并只告警
# 一次。适合外接精确 tokenizer，例如 `python3 /path/to/estimate.py`。
# estimate = "python3 /path/to/estimate.py"
# 单次钩子执行硬超时（秒），覆盖启动与读尽输出；超时整组击杀，绝不挂起。
timeout_secs = 30

[shell]
# 工具命令与 `yaa --notify`（命令与 stdin 两形态）共用本节限额：`--notify` 的解析优先级为
# `--notify-timeout` → `YAA_NOTIFY_*` 环境变量 → 本节 → 默认。
# 单条命令超时（秒）。
timeout_secs = 120
# 单流输出上限（字符）；超过后仅保留头部 head_chars 与尾部 tail_chars，
# 完整输出写入会话目录的 outputs/。
max_stream_chars = 32768
head_chars = 8192
tail_chars = 2048

[agent]
# 单个回合内最多模型步数。
max_steps = 30
# 单次模型请求超时（秒），覆盖连接与响应体读取；超时不重试，按模型错误（退出码 4）失败。
request_timeout_secs = 300

[compaction]
# 渲染期压缩：历史超阈值时先修剪工具正文，仍超阈值再调模型生成摘要；摘要写入会话目录
# 的 summaries/，原始 default.jsonl 不变。触发阈值按模型上下文窗口计算，窗口在 llm 配置
# （见 llm.example.toml 的 context_window）提供；未提供窗口即整段禁用压缩。
enabled = true
# 投影超过「窗口 × threshold_ratio」即触发压缩。
threshold_ratio = 0.8
# 逐字保留的近期尾部占窗口比例；须小于 threshold_ratio。
retain_ratio = 0.16
# ASCII token 估算密度；非 ASCII（CJK、emoji 等）每码点按 1 token 计。
chars_per_token = 4
# 摘要调用的输出上限。
max_tokens = 8192
# 工具消息正文超过此码点数才修剪。
prune_threshold_chars = 8192
# 修剪保留的头部与尾部码点数；两者与修剪标记之和须不超过 prune_threshold_chars。
prune_head_chars = 4096
prune_tail_chars = 1024
# 摘要后仍超阈值的额外压缩尝试次数。
retries = 1
