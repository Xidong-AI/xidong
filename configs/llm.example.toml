# xidong 模型供应配置示例。
#
# 复制到 $XIDONG_CONFIG_HOME/llm.toml（默认 ~/.config/xidong/llm.toml），由 `llm` 钩子
# 读取并输出给 xidong。文件含密钥，请勿提交到版本库。

base_url = "https://api.deepseek.com"
api_key = "sk-……"
model = "deepseek-chat"

# endpoint_format 决定思考（reasoning）内容是否回传上游：
#   - openai（缺省）：不回传；
#   - deepseek / kimi / qwen / glm：请求带 tools 时，带 tool_calls 的 assistant
#     消息回传顶层 reasoning_content（思考为空时也发空串）。
# 以下均为可选，缺省值为 endpoint_format = "openai"、temperature = 0.7、max_tokens = 4096。
endpoint_format = "deepseek"
temperature = 0.7
max_tokens = 4096

# 模型上下文窗口（token）；供渲染期压缩计算触发阈值，缺失即禁用压缩。
# 属供应侧：换模型时与 model 一并调整，无需改 config.toml。
context_window = 128000

# base_url 已以 /v1 结尾时直接补 /chat/completions，否则补 /v1/chat/completions。
