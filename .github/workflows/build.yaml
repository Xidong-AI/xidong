name: 编译

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'

concurrency:
  group: "build"
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  check:
    name: 检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: 编译检查
        run: cargo check --all-targets

      - name: Clippy 检查
        run: cargo clippy --all-targets -- -D warnings

      - name: 测试
        run: cargo test

  build:
    name: 编译（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build: [linux, macos]
        include:
          - build: linux
            os: ubuntu-latest
          - build: macos
            os: macos-latest
    steps:

      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 为 ubuntu-latest 安装 Rust
        if: matrix.os == 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl

      - name: 为 macos-latest 安装 Rust
        if: matrix.os == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-apple-darwin

      - name: 恢复 Rust 缓存
        uses: actions/cache/restore@v3
        id: cache_store
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ matrix.os }}-cargo-${{ hashFiles('./Cargo.lock') }}

      - name: 编译
        run: |
          cargo build --release --bin yaa

      - name: 收集包
        run: |
          mkdir -p yaa_${{ matrix.build }}
          cp target/release/yaa yaa_${{ matrix.build }}/
        shell: bash

      - name: 上传包
        uses: actions/upload-artifact@v4
        with:
          name: yaa_${{ matrix.build }}
          path: yaa_${{ matrix.build }}/**/*
          retention-days: 3

      - name: 保存 Rust 缓存
        uses: actions/cache/save@v3
        if: steps.cache_store.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ matrix.os }}-cargo-${{ hashFiles('./Cargo.lock') }}
